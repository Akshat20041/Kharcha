name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, types, tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Prisma config needs a URL even for generation/validation. Nothing connects
      # here: integration/browser fixtures create their own disposable clusters.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/unused
      GROQ_API_KEY: ""
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js and npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Standalone frontend production build (before Prisma generation)
        env:
          NEXT_PUBLIC_AUTH_MODE: supabase
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3312
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
        run: npm run build --workspace @kharcha/web
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Lint both applications
        run: npm run lint
      - name: Type check both applications
        run: npm run typecheck
      - name: Backend unit tests
        run: npm test
      - name: Frontend unit tests
        run: npm run test:web
      - name: Integration tests and migration replay
        run: npm run test:integration
      - name: Backend production build
        run: npm run build --workspace @kharcha/api
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Authentication browser tests (isolated Auth fixture)
        run: npm run test:e2e:auth
